# Filename pattern per 05_Business_Rules.md section 11.
# Pattern: <ReportType>_<DeviceName>_<Phase>_Audit_Report_<ClientLegalName>_<EntityCode(s)>_<Year>_V<Major>.<Minor>
#
# Examples:
#   VA Report:   VA_Server_First_Audit_Report_Client_Name_SCPL_2026_V1.0.xlsx
#   CA Report:   Configuration_Audit_Server_First_Audit_Report_Client_Name_SCPL_2026_V1.0.xlsx
#   VA TextJoin: VA_Server_First_Audit_Report_Client_Name_SCPL_2026_V1.0_TextJoin.xlsx
#   CA TextJoin: Configuration_Audit_Server_First_Audit_Report_Client_Name_SCPL_2026_V1.0_TextJoin.xlsx
pattern_tokens:
  - name: "report_type"
    source: "static per pipeline"
    values: {va: "VA", ca: "Configuration_Audit"}
  - name: "device_name"
    source: "engagement_metadata.scope_label"     # Device name: e.g. "Server", "Firewall"
  - name: "phase"
    source: "engagement_metadata.phase_label"      # e.g. "First", "Retest"
  - name: "literal"
    value: "Audit_Report"
  - name: "client_legal_name"
    source: "engagement_metadata.client_name"
    transform: "spaces_to_underscores"
  - name: "entity_codes"
    source: "engagement_metadata.entity_codes"      # optional, free-text tokens - see Q5
    optional: true
  - name: "year"
    source: "engagement_metadata.report_date.year"
  - name: "version"
    source: "engagement_metadata.report_version"
    transform: "period_to_underscore"    # e.g. 1.2 -> V1_2 in the filename
    prefix: "V"

separator: "_"
extension: ".xlsx"

sanitization:
  strip_characters: ['/', '\\', ':', '*', '?', '"', '<', '>', '|', '&']
  replace_with: ""

overwrite_policy: "prompt_or_auto_increment"   # never silently overwrite - per 11_Project_Architecture.md
