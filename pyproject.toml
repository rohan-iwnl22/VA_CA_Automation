[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "va-ca-automation"
version = "0.1.0"
description = "VA/CA Excel report automation for Nessus exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "python-docx>=1.0",
  "matplotlib>=3.7",
]

[project.scripts]
va-ca-automation = "va_ca_automation.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

