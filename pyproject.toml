[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "va-ca-automation"
version = "0.1.0"
description = "VA/CA Excel report automation for Nessus exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "python-docx>=1.0",
  "matplotlib>=3.7",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "asyncpg>=0.29.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.6",
  "python-dotenv>=1.0.0",
]

[project.scripts]
va-ca-automation = "va_ca_automation.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

